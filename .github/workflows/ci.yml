name: CI and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version in package.json to publish from main'
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }}, Node 22)
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, MIT
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, MIT
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run tests
        run: node --test
      - name: Check project resources
        run: node scripts/check.mjs

  release:
    name: Publish selected version
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    # Serialize npm latest updates without cancelling an active publication.
    concurrency:
      group: release-dsh-sync
      cancel-in-progress: false
    steps:
      - name: Check out exact source and version history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, MIT
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, MIT
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Release a selected version to GitHub and npm
        run: node scripts/release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_CONFIG_AUDIT: 'false'
          NPM_CONFIG_FUND: 'false'
          NPM_CONFIG_UPDATE_NOTIFIER: 'false'
